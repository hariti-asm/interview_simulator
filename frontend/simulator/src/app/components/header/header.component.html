<header class="bg-white border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">

      <div class="flex items-center">
        <a routerLink="/" class="text-emerald-500 text-xl font-bold flex items-center">
          <span class="text-emerald-500 text-2xl mr-2">●</span> Intervio
        </a>
      </div>

      <nav class="hidden md:flex items-center space-x-6">
        <a routerLink="/" routerLinkActive="bg-emerald-500 text-white" [routerLinkActiveOptions]="{exact: true}"
           class="px-4 py-2 rounded-full text-gray-500 hover:text-emerald-500">Home</a>
        <a routerLink="/about" routerLinkActive="bg-emerald-500 text-white"
           class="text-gray-500 px-4 py-2 hover:text-emerald-500">About Us</a>
        <a routerLink="/features" routerLinkActive="bg-emerald-500 text-white"
           class="text-gray-500 px-4 py-2 hover:text-emerald-500 flex items-center">
          Features
          <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </a>
        <a routerLink="/testimonials" routerLinkActive="bg-emerald-500 text-white"
           class="text-gray-500 px-4 py-2 hover:text-emerald-500">Testimonial</a>
        <a (click)="testLoginNavigation()" class="text-gray-500 px-4 py-2 hover:text-emerald-500 cursor-pointer">Login</a>
        <a routerLink="/register" class="text-gray-500 px-4 py-2 hover:text-emerald-500">Register</a>
      </nav>

      <button (click)="onStartInterview()"
              class="hidden md:block bg-emerald-500 text-white px-6 py-2.5 rounded-full hover:bg-emerald-600 transition">
        Start Interview
      </button>

      <!-- Mobile Menu Button -->
      <button class="md:hidden text-gray-600 focus:outline-none" (click)="toggleMenu()">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="!menuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          <path *ngIf="menuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div *ngIf="menuOpen" class="md:hidden space-y-2 py-2">
      <a routerLink="/" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Home</a>
      <a routerLink="/about" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">About Us</a>
      <a routerLink="/features" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Features</a>
      <a routerLink="/testimonials" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Testimonial</a>
      <a (click)="testLoginNavigation()" class="block px-4 py-2 text-gray-700 hover:bg-gray-100 cursor-pointer">Login</a>
      <a routerLink="/register" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Register</a>
      <button (click)="onStartInterview()" class="w-full bg-emerald-500 text-white px-4 py-2 rounded-lg hover:bg-emerald-600 transition">
        Start Interview
      </button>
    </div>
  </div>
</header>
