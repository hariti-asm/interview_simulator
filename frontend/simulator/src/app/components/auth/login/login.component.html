<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <a routerLink="/" class="text-emerald-500 text-xl font-bold flex items-center">
        <span class="text-emerald-500 text-2xl mr-2">●</span> Intervio
      </a>
    </div>
    <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">Sign in to your account</h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-3xl sm:px-10">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div *ngIf="errorMessage" class="text-red-500 text-sm text-center">{{ errorMessage }}</div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
          <div class="mt-1">
            <input id="email" formControlName="email" type="email"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-full shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                   [ngClass]="{'border-red-500': loginForm.get('email')?.errors && loginForm.get('email')?.touched}">
          </div>
          <div *ngIf="loginForm.get('email')?.errors?.['required'] && loginForm.get('email')?.touched"
               class="mt-1 text-red-500 text-sm">
            Email is required
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <div class="mt-1">
            <input id="password" formControlName="password" type="password"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-full shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                   [ngClass]="{'border-red-500': loginForm.get('password')?.errors && loginForm.get('password')?.touched}">
          </div>
          <div *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched"
               class="mt-1 text-red-500 text-sm">
            Password is required
          </div>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember-me" formControlName="rememberMe" type="checkbox"
                   class="h-4 w-4 text-emerald-500 focus:ring-emerald-500 border-gray-300 rounded">
            <label for="remember-me" class="ml-2 block text-sm text-gray-900">Remember me</label>
          </div>

          <div class="text-sm">
            <a routerLink="/forgot-password" class="font-medium text-emerald-500 hover:text-emerald-600">
              Forgot your password?
            </a>
          </div>
        </div>

        <div>
          <button type="submit"
                  [disabled]="loginForm.invalid"
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-full shadow-sm text-sm font-medium text-white bg-emerald-500 hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 disabled:opacity-50">
            Sign in
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
