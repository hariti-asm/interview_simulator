<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <a routerLink="/" class="text-emerald-500 text-xl font-bold flex items-center">
        <span class="text-emerald-500 text-2xl mr-2">●</span> Intervio
      </a>
    </div>
    <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">Create your account</h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-3xl sm:px-10">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div *ngIf="errorMessage" class="text-red-500 text-sm text-center">{{ errorMessage }}</div>

        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Full name</label>
          <div class="mt-1">
            <input id="name" formControlName="name" type="text"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-full shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                   [ngClass]="{'border-red-500': registerForm.get('name')?.errors && registerForm.get('name')?.touched}">
          </div>
          <div *ngIf="registerForm.get('name')?.errors?.['required'] && registerForm.get('name')?.touched"
               class="mt-1 text-red-500 text-sm">
            Name is required
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
          <div class="mt-1">
            <input id="email" formControlName="email" type="email"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-full shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                   [ngClass]="{'border-red-500': registerForm.get('email')?.errors && registerForm.get('email')?.touched}">
          </div>
          <div *ngIf="registerForm.get('email')?.errors?.['required'] && registerForm.get('email')?.touched"
               class="mt-1 text-red-500 text-sm">
            Email is required
          </div>
        </div>

        <div>
          <label for="role" class="block text-sm font-medium text-gray-700">Role</label>
          <div class="mt-1">
            <select id="role" formControlName="role"
                    class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-full shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500">
              <option [value]="roles.CANDIDATE">Candidate</option>
            </select>
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <div class="mt-1">
            <input id="password" formControlName="password" type="password"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-full shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                   [ngClass]="{'border-red-500': registerForm.get('password')?.errors && registerForm.get('password')?.touched}">
          </div>
          <div *ngIf="registerForm.get('password')?.errors?.['required'] && registerForm.get('password')?.touched"
               class="mt-1 text-red-500 text-sm">
            Password is required
          </div>
        </div>

        <div>
          <button type="submit"
                  [disabled]="registerForm.invalid"
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-full shadow-sm text-sm font-medium text-white bg-emerald-500 hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 disabled:opacity-50">
            Register
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
