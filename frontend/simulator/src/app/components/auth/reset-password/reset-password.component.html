<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <a routerLink="/" class="text-emerald-500 text-xl font-bold flex items-center">
        <span class="text-emerald-500 text-2xl mr-2">●</span> Intervio
      </a>
    </div>
    <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">Set new password</h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-3xl sm:px-10">
      <div *ngIf="errorMessage" class="mb-4 text-red-500 text-sm text-center">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="mb-4 text-green-500 text-sm text-center">{{ successMessage }}</div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700">New password</label>
          <div class="mt-1">
            <input id="newPassword"
                   formControlName="newPassword"
                   type="password"
                   (input)="onPasswordInput()"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-full shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                   [ngClass]="{'border-red-500': resetForm.get('newPassword')?.errors && resetForm.get('newPassword')?.touched}">
          </div>
          <div *ngIf="resetForm.get('newPassword')?.touched && getPasswordErrorMessage()"
               class="mt-1 text-red-500 text-sm">
            {{ getPasswordErrorMessage() }}
          </div>
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm new password</label>
          <div class="mt-1">
            <input id="confirmPassword"
                   formControlName="confirmPassword"
                   type="password"
                   (input)="onPasswordInput()"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-full shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                   [ngClass]="{'border-red-500': (resetForm.get('confirmPassword')?.touched && getConfirmPasswordErrorMessage())}">
          </div>
          <div *ngIf="resetForm.get('confirmPassword')?.touched && getConfirmPasswordErrorMessage()"
               class="mt-1 text-red-500 text-sm">
            {{ getConfirmPasswordErrorMessage() }}
          </div>
        </div>

        <div>
          <button type="submit"
                  [disabled]="resetForm.invalid || isLoading"
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-full shadow-sm text-sm font-medium text-white bg-emerald-500 hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 disabled:opacity-50">
            <span *ngIf="!isLoading">Reset password</span>
            <span *ngIf="isLoading">Resetting...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
