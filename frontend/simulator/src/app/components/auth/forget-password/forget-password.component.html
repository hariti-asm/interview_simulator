<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <a routerLink="/" class="text-emerald-500 text-xl font-bold flex items-center">
        <span class="text-emerald-500 text-2xl mr-2">●</span> Intervio
      </a>
    </div>
    <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">Reset your password</h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Enter your email address and we'll send you a link to reset your password.
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-3xl sm:px-10">
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div *ngIf="errorMessage" class="text-red-500 text-sm text-center">{{ errorMessage }}</div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
          <div class="mt-1">
            <input id="email" formControlName="email" type="email"
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-full shadow-sm placeholder-gray-400 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                   [ngClass]="{'border-red-500': forgotForm.get('email')?.errors && forgotForm.get('email')?.touched}">
          </div>
          <div *ngIf="forgotForm.get('email')?.errors?.['required'] && forgotForm.get('email')?.touched"
               class="mt-1 text-red-500 text-sm">
            Email is required
          </div>
          <div *ngIf="forgotForm.get('email')?.errors?.['email'] && forgotForm.get('email')?.touched"
               class="mt-1 text-red-500 text-sm">
            Please enter a valid email
          </div>
        </div>

        <div>
          <button type="submit"
                  [disabled]="forgotForm.invalid"
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-full shadow-sm text-sm font-medium text-white bg-emerald-500 hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 disabled:opacity-50">
            Send reset link
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
