<app-header></app-header>
<div class="container mx-auto p-4">
  <div class="mt-8 bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <h2 class="text-2xl font-semibold mb-6">Interviews by Position</h2>

    <div class="relative h-[400px] w-full mb-8">
      <svg height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 800 450" width="100%">
        <rect fill="white" height="450" width="800"/>

        <g transform="translate(80, 350)">
          <ng-container *ngFor="let y of [0, 50, 100, 150, 200, 250, 300]">
            <line [attr.y1]="-y" [attr.y2]="-y" stroke="#f0f0f0" stroke-width="1" x1="0" x2="650"/>
          </ng-container>

          <ng-container *ngFor="let item of positionCounts; let i = index">
            <text
              [attr.transform]="'rotate(-45, ' + (100 + i * 150) + ', 45)'"
              [attr.x]="100 + i * 150"
              fill="#666666"
              font-family="system-ui"
              font-size="12"
              text-anchor="middle"
              y="45">
              {{ item.position }}
            </text>

            <rect
              [attr.height]="(item.count / maxCount) * 300"
              [attr.x]="70 + i * 150"
              [attr.y]="-1 * (item.count / maxCount) * 300"
              fill="#4F46E5"
              opacity="0.9"
              rx="4"
              ry="4"
              width="60"/>

            <text
              [attr.x]="100 + i * 150"
              [attr.y]="-1 * (item.count / maxCount) * 300 - 10"
              fill="#666666"
              font-family="system-ui"
              font-size="12"
              text-anchor="middle">{{ item.count }}
            </text>
          </ng-container>

          <ng-container *ngFor="let y of [0, 50, 100, 150, 200, 250, 300]; let j = index">
            <text [attr.y]="-y" fill="#666666" font-family="system-ui" font-size="12" text-anchor="end" x="-10">
              {{ j }}
            </text>
          </ng-container>

          <text fill="#666666" font-family="system-ui" font-size="12" text-anchor="middle" transform="rotate(-90,-40,-150)"
                x="-40" y="-150">
            Count
          </text>
        </g>
      </svg>
    </div>
    <table [dataSource]="users" class="w-full" mat-table>
      <ng-container matColumnDef="id">
        <th *matHeaderCellDef class="text-sm font-medium text-gray-500 px-4 py-3 text-left" mat-header-cell> ID</th>
        <td *matCellDef="let user" class="px-4 py-4 text-sm text-gray-900" mat-cell> {{ user.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th *matHeaderCellDef class="text-sm font-medium text-gray-500 px-4 py-3 text-left" mat-header-cell> Name</th>
        <td *matCellDef="let user" class="px-4 py-4 text-sm text-gray-900" mat-cell> {{ user.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th *matHeaderCellDef class="text-sm font-medium text-gray-500 px-4 py-3 text-left" mat-header-cell> Email</th>
        <td *matCellDef="let user" class="px-4 py-4 text-sm text-gray-900" mat-cell> {{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th *matHeaderCellDef class="text-sm font-medium text-gray-500 px-4 py-3 text-left" mat-header-cell> Actions
        </th>
        <td *matCellDef="let user" class="px-4 py-4 text-sm" mat-cell>
          <div class="flex gap-2">
            <button (click)="openEditDialog(user)" class="text-emerald-600 hover:text-emerald-700" mat-icon-button>
              <mat-icon class="h-4 w-4">edit</mat-icon>
            </button>
            <button (click)="confirmDelete(user.id)" class="text-red-600 hover:text-red-700" mat-icon-button>
              <mat-icon class="h-4 w-4">delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr *matHeaderRowDef="['id', 'name', 'email', 'actions']" class="bg-gray-50" mat-header-row></tr>
      <tr *matRowDef="let row; columns: ['id', 'name', 'email', 'actions'];" class="border-t border-gray-200 hover:bg-gray-50 transition-colors"
          mat-row></tr>
    </table>
  </div>
</div>

<div *ngIf="selectedUser" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
      <h3 class="text-lg font-semibold text-gray-900">Edit User</h3>
      <button (click)="closeDialog()" class="text-gray-400 hover:text-gray-500">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
        </svg>
      </button>
    </div>

    <div class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="name">Name</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2"/>
            </svg>
          </div>
          <input
            [(ngModel)]="selectedUser.name"
            class="pl-10 w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            id="name"
            placeholder="Enter name"
          />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email Address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2"/>
            </svg>
          </div>
          <input
            [(ngModel)]="selectedUser.email"
            class="pl-10 w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            id="email"
            placeholder="Enter email address"
          />
        </div>
      </div>
    </div>

    <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end space-x-3">
      <button
        (click)="closeDialog()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
        mat-button
      >
        Cancel
      </button>
      <button
        (click)="saveUser()"
        class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700"
        mat-button
      >
        Save Changes
      </button>
    </div>
  </div>
</div>
