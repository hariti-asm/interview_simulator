services:
  postgres:
    image: 'postgres:latest'
    container_name: my-postgres
    restart: always
    environment:
      - 'POSTGRES_DB=interview'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
