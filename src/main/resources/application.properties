spring.application.name=simulator
server.port=8083

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Database (using env variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Mail (using env variables)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

openai.api.key=${OPENAI_API_KEY}

spring.security.jwt.secret-key=${JWT_SECRET}
spring.security.jwt.expiration=86400000
spring.security.jwt.refresh-token.expiration=604800000
spring.security.jwt.remember-me.expiration=2592000000
spring.mail.from=${MAIL_USERNAME}
DB_URL=jdbc:postgresql://localhost:5432/simulator
spring.security.default-passwords.admin=admin
spring.security.default-passwords.candidate=candidate